<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ manager }} — Tracker</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <!-- Chart.js is self-hosted (no CDN) so charts render even when third-party
       CDNs are blocked; charts use a category axis so no date adapter is needed. -->
  <script src="/static/chart.umd.js"></script>
  <style>
    :root { --bg:#faf8f6; --card:#fff; --line:#e6ddd6; --wine:#6b1f2a; --wine2:#a23b47; --muted:#8a7f78; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
           background:var(--bg); color:#2a2320; }
    header { background:var(--wine); color:#fff; padding:18px 24px; }
    header h1 { margin:0; font-size:20px; font-weight:600; }
    header .sub { opacity:.8; font-size:13px; margin-top:2px; }
    nav { display:flex; gap:4px; padding:0 16px; background:#fff; border-bottom:1px solid var(--line);
          position:sticky; top:0; z-index:5; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    nav button { border:0; background:none; padding:14px 18px; font-size:14px; cursor:pointer;
                 color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap; }
    header .picker { margin-top:10px; display:flex; align-items:center; gap:8px; }
    header .picker label { font-size:12px; opacity:.8; }
    header .picker select { padding:6px 10px; border-radius:6px; border:0;
                            font-size:14px; max-width:70vw; }
    nav button.active { color:var(--wine); border-bottom-color:var(--wine); font-weight:600; }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:18px; margin-bottom:20px; }
    .card h2 { margin:0 0 14px; font-size:15px; color:var(--wine); }
    /* Narrow screens: let a wide table scroll inside its card instead of
       clipping columns or wrapping cells one character per line. */
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .table-wrap table { min-width:560px; }
    td.nowrap { white-space:nowrap; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; }
    td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .up { color:#1a7d43; } .down { color:#b3261e; } .new { color:var(--wine); font-weight:600; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
             background:#f0e7e2; color:var(--wine); }
    .muted { color:var(--muted); font-size:12px; }
    .notice { background:#fff6e6; border:1px solid #f0d9a8; color:#7a5b12;
              padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
    select { padding:6px 10px; border:1px solid var(--line); border-radius:6px; }
    .chart-wrap { position:relative; height:320px; }
    .pies { display:flex; flex-wrap:wrap; gap:18px; }
    .pie { flex:1 1 320px; margin:0; min-width:0; }
    .pie figcaption { font-size:13px; font-weight:600; margin-bottom:8px; }
    .pie-wrap { position:relative; height:260px; }
    .ok { color:#1a7d43; } .error { color:#b3261e; } .skipped { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>{{ manager }}</h1>
    <div class="sub">Asset-management tracker — append-only history of AUM, holdings & people</div>
    {% if managers and managers|length > 1 %}
    <div class="picker">
      <label for="mgr">추적 대상</label>
      <select id="mgr" onchange="switchManager(this.value)">
        {% for m in managers %}
        <option value="{{ m.slug }}" {{ 'selected' if m.slug == selected }}>
          {{ m.name }}{% if m.quarters %} · {{ m.quarters }}개 분기{% else %} · 미수집{% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
  </header>

  <nav>
    <button class="active" data-tab="/tab/overview" hx-target="#content"
            onclick="setActive(this)">Overview</button>
    <button data-tab="/tab/aum" hx-target="#content" onclick="setActive(this)">AUM</button>
    <button data-tab="/tab/us" hx-target="#content" onclick="setActive(this)">US Holdings</button>
    <button data-tab="/tab/korea" hx-target="#content" onclick="setActive(this)">Korea</button>
    <button data-tab="/tab/changes" hx-target="#content" onclick="setActive(this)">Changes</button>
  </nav>

  <main>
    <div id="content" hx-trigger="load"></div>
  </main>

  <script>
    // The selected manager scopes every request, so it is appended to each tab
    // URL rather than kept in a template-baked hx-get.
    var MANAGER = {{ (selected or '') | tojson_safe }};
    function tabUrl(path){
      return MANAGER ? path + '?manager=' + encodeURIComponent(MANAGER) : path;
    }
    function wireTabs(){
      document.querySelectorAll('nav button[data-tab]').forEach(function(b){
        b.setAttribute('hx-get', tabUrl(b.dataset.tab));
      });
      var content = document.getElementById('content');
      content.setAttribute('hx-get', tabUrl('/tab/overview'));
      if (window.htmx) htmx.process(document.body);
    }
    function switchManager(slug){
      window.location.search = '?manager=' + encodeURIComponent(slug);
    }
    function setActive(btn){
      document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    }
    wireTabs();
    // Re-run any <script> tags inside swapped-in HTMX content.
    document.body.addEventListener('htmx:afterSwap', function(e){
      e.detail.target.querySelectorAll('script').forEach(function(old){
        const s=document.createElement('script');
        s.textContent=old.textContent; old.replaceWith(s);
      });
    });
  </script>
</body>
</html>
